packages:
  - "packages/*"
linkWorkspacePackages: true
preferWorkspacePackages: true
saveWorkspaceProtocol: false
overrides:
  # Keep this dist-tag dependency on the registry; update when refreshing latest.
  "think-resource>think-helper": "1.1.5"
allowBuilds:
  better-sqlite3: true
  core-js: true
  ejs: true
  es5-ext: true
  execSync: true
  fsevents: true
  nodemon: true
  pre-commit: true
  spawn-sync: true
